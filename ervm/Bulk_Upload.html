<!DOCTYPE html>
<html lang="en">
<head>
  <title>Audit Recommendations</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
  <script src="js/bootstrap.min.js"></script>

  <style>
	body{
		font-family: Calibri;
		font-size: 16px;
		color: #000;
	}
	
	table th, td{
		text-align: center;
	}

	.col-md-12, .col-sm-12, .col-xs-12{
		
		padding: 0;
		
	}

	.col-md-6, .col-sm-6, .col-xs-6{
		margin: 1% 0%;
		background: #FBFBFB;
	}

	.form-control{
		color: #000;
	}

	
  </style>
</head>
<body>
	<div class="col-md-12 col-sm-12 col-xs-12" style="padding: 0;">
		<img src="images/header.png" style="width: 100%;">
	</div>
	<div class="col-md-12 col-sm-12 col-xs-12">
		<div class="col-md-3 col-sm-3"></div>
		<div class="col-md-6 col-sm-6 col-xs-12" style="margin: 2% 0%;">
		<form>
			
			<div class="col-md-12 col-sm-12 col-xs-12">
				<div class="col-md-6 col-sm-6 col-xs-6"  style="font-weight: bold; text-align: right;">
					Attachment
				</div>
				<div class="col-md-6 col-sm-6 col-xs-6">
					<input type="file" id="myFile" required>
				</div>
			</div>
			<div class="col-md-12 col-sm-12 col-xs-12">
				<center><input class="btn-danger" type="submit" style="font-size: 16px; margin: 6% 0%; padding: 0.5% 1.5%; border-radius: 6px;" required></center>
			</div>
		</div>
		</form>
		</div>
	</body>
</html>
